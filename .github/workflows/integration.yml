name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      skip_neovim:
        description: "Skip Neovim setup (faster, skips Rust/cargo)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main, master]

jobs:
  integration-fedora:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build Fedora test image
        run: docker build -f tests/Dockerfile.fedora -t reparo-test-fedora .

      - name: Run Fedora setup + verification
        run: >
          docker run --rm
          -e SKIP_NEOVIM=${{ github.event.inputs.skip_neovim || 'false' }}
          reparo-test-fedora

  integration-ubuntu:
    name: integration-ubuntu (${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    steps:
      - uses: actions/checkout@v4

      - name: Build Ubuntu ${{ matrix.ubuntu }} test image
        run: >
          docker build -f tests/Dockerfile.ubuntu
          --build-arg UBUNTU_VERSION=${{ matrix.ubuntu }}
          -t reparo-test-ubuntu-${{ matrix.ubuntu }} .

      - name: Run Ubuntu ${{ matrix.ubuntu }} setup + verification
        run: >
          docker run --rm
          -e SKIP_NEOVIM=${{ github.event.inputs.skip_neovim || 'false' }}
          reparo-test-ubuntu-${{ matrix.ubuntu }}
